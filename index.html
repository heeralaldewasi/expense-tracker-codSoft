<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Expense Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h2>Expense Tracker</h2>
        <div class="total-box">Total: ₹<span id="total-amount">0.00</span></div>

        <form id="expense-form">
            <input type="text" id="expense-name" placeholder="Kya khareeda? (e.g. Coffee)" required>
            <input type="number" id="expense-amount" placeholder="Kitna kharch hua? (e.g. 150)" step="0.01" required>
            <select id="expense-category">
                <option value="Food & Dining">Food & Dining</option>
                <option value="Transportation">Transportation</option>
                <option value="Utilities">Utilities</option>
                <option value="Entertainment">Entertainment</option>
                <option value="Shopping">Shopping</option>
                <option value="Other">Other</option>
            </select>
            <button type="submit">Add Expense</button>
        </form>

        <ul id="expense-list"></ul>
    </div>

    <script src="script.js"></script>
</body>
</html>
